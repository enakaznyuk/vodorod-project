server:
  port: 8081

spring:
  application:
    name: order-receipt-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_receipts
    username: postgres
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-receipts
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    orders-topic: orders
